name: Build Vial Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make SKIP_GIT=yes do52:vial

      - name: Upload HEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: do52_vial_hex
          path: |
            *.hex
            .build/*.hex
