name: Build Vial Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr binutils-avr avr-libc dfu-programmer
        python -m pip install --upgrade pip
        python -m pip install qmk

    - name: Build firmware
      run: |
        make do52:vial

    - name: Upload HEX Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: do52_vial_hex
        path: |
          *.hex
          .build/*.hex