name: Build Vial Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m pip install --break-system-packages -r requirements.txt
          qmk config user.qmk_home="$GITHUB_WORKSPACE"
          qmk compile -kb do52 -km vial 2>&1 | tee build.log

      - name: Upload HEX Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: do52_vial_hex
          path: |
            *.hex
            .build/*.hex

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
