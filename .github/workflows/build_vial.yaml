name: Build Vial Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          git config --global --add safe.directory "$(pwd)"
          qmk compile -kb do52 -km vial
          test -f do52_vial.hex
          ls -la do52_vial.hex

      - name: Upload HEX Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: do52_vial_hex
          path: do52_vial.hex

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .build/*.log
            *.log
          if-no-files-found: ignore
